<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Регистрация</title>
    <link rel="stylesheet" href="../css/Регистрация.css">
    <script src="../js/Регистрация.js" defer></script>
</head>
<body>
    <div id="main">
        <p id="registrationText">Регистрация</p>
        <a href="Авторизация.html"><button id="enter">Вход</button></a>
        <div id="input">
            <input id="phonenumber" type="text" value="+7" placeholder="Номер телефона с +7">
            <br><br><br>
            <input id="email" type="text" placeholder="Email">
            <br><br><br>
            <input id="password" type="password" placeholder="Пароль">
            <br><br><br>
            <input id="repeatPassword" type="password" placeholder="Повторите пароль">
        </div>
        <button id="finish">Зарегистрироваться</button>
        <input id="politic" type="checkbox">
        <input id="more18" type="checkbox">
        <p id="politictext">Соглашаюсь с <a href="#">условиями</a> и <a href="#">положениями</a></p>
        <p id="more18text">Мне есть 18</p>
    </div>
    <a id="ahome" href="Pidep.html">
        <button id="home"><img src="../images/Home.svg" alt="Домой"></button>
    </a>
</body>
</html>
